/*
 * 列出所有声明了 minSdk > 21 的 AAR 依赖 (以及它们的 manifest package 名)。
 *
 * 用途: 兼容包 (minSdk 21) 的 manifest 合并一次只报一个库, 一轮 CI 六分钟, 靠报错逐个补太慢。
 * 这个 init script 直接读 Gradle 缓存里已下载的 AAR (不额外联网), 一次把清单全打出来。
 *
 *   ./gradlew -I .github/workflows/scan-android-minsdk.init.gradle --no-configuration-cache \
 *       -Pani.android.legacy=true -Pani.android.legacyMinSdk=21 :app:android:scanAndroidMinSdk
 *
 * 输出里的 `pkg=` 就是 `tools:overrideLibrary` 要写的包名。
 */

gradle.afterProject { p ->
    if (p.path != ':app:android') return

    p.tasks.register('scanAndroidMinSdk') {
        group = 'help'
        description = '列出所有 minSdk > 21 的 AAR 依赖及其 manifest package 名'

        doLast {
            int target = 21
            def candidates = ['defaultTvReleaseRuntimeClasspath', 'tvReleaseRuntimeClasspath', 'releaseRuntimeClasspath']
            def conf = candidates.collect { p.configurations.findByName(it) }.find { it != null }
            if (conf == null) {
                println '::warning::没找到 release runtime classpath, 跳过扫描'
                return
            }
            println "扫描配置: ${conf.name} (基线 minSdk = ${target})"

            def rows = []
            int scanned = 0
            conf.incoming.artifacts.artifacts.each { artifact ->
                def file = artifact.file
                if (!file.name.endsWith('.aar')) return
                scanned++
                try {
                    def zip = new java.util.zip.ZipFile(file)
                    try {
                        def entry = zip.getEntry('AndroidManifest.xml')
                        if (entry == null) return
                        def text = zip.getInputStream(entry).getText('UTF-8')
                        if (!text.startsWith('<')) return // 二进制清单: 这里读不出来, 交给 AGP 自己的报错
                        def minSdkMatcher = (text =~ /minSdkVersion="(\d+)"/)
                        if (!minSdkMatcher.find()) return
                        int minSdk = minSdkMatcher.group(1).toInteger()
                        if (minSdk <= target) return
                        def packageMatcher = (text =~ /package="([^"]+)"/)
                        def pkg = packageMatcher.find() ? packageMatcher.group(1) : '(未声明)'
                        def id = artifact.id.componentIdentifier
                        def name = id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                                ? "${id.group}:${id.module}:${id.version}".toString()
                                : id.displayName
                        rows << [minSdk, name, pkg]
                    } finally {
                        zip.close()
                    }
                } catch (Throwable ignored) {
                    // 单个 AAR 读失败不影响整体清单
                }
            }

            println ''
            println "=== AAR minSdk > ${target}: ${rows.size()} 个 (共扫描 ${scanned} 个 AAR) ==="
            rows.sort { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] }.each { row ->
                println String.format('minSdk=%-3s %-60s pkg=%s', row[0], row[1], row[2])
            }
            println "=== 把上面所有 pkg= 的值加进 app/android/src/izukoTv/AndroidManifest.xml 的 tools:overrideLibrary ==="
        }
    }
}
